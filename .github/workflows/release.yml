name: release

# Publish-only. Versioning is owned upstream in the monorepo (CONTRIBUTING.md
# "Cut a release"): the tree that lands on main here has ALREADY had
# `changeset version` applied — package.json + CHANGELOG bumped, changeset files
# consumed. This workflow therefore only PUBLISHES; it never opens a "Version
# Packages" PR. That is deliberate: the monorepo one-way-mirrors its tree onto
# main, so a version bump made on THIS side would be reverted by the next mirror
# push. Owning the bump upstream keeps the mirror and the release from fighting.
#
# The "no unconsumed changesets" guard below fails loud if a changeset ever
# reaches main un-versioned, instead of silently drifting.
#
# Runs on main only. workflow_dispatch(dry_run) rehearses the whole path — build,
# smoke test, publish preview — without publishing to npm.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the release (build + smoke test + npm publish --dry-run) without publishing'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # Re-enable when a second maintainer joins, to require manual approval:
    # environment: npm-production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) requires npm 11.5.1+. Node 22 LTS still
      # ships npm 10.x; upgrade explicitly so `changeset publish` can use OIDC.
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # Fail loud if a changeset reached main un-versioned. Versioning is owned
      # upstream (CONTRIBUTING.md): the monorepo runs `changeset version` before
      # merge, so main should carry NO changeset files. If one is here, the bump
      # was skipped — publishing now would ship the wrong (un-bumped) version,
      # and the next mirror push would clobber any bump this side tried to make.
      - name: Guard — no unconsumed changesets on main
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null || true)
          if [ -n "$pending" ]; then
            echo "::error::Unconsumed changeset(s) on main:"; echo "$pending"
            echo "::error::Versioning is monorepo-owned — run 'changeset version' in packages/verify BEFORE merging (see CONTRIBUTING.md). Publishing an un-versioned tree is blocked."
            exit 1
          fi
          echo "no unconsumed changesets — tree is release-ready"

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Pack dry-run
        run: npm pack --dry-run

      # Smoke-test the actual artifact that will ship: pack, install into a
      # throwaway dir, run the bin against a fixture. Catches regressions
      # like missing `files`, broken `bin`, or shebang issues that source-only
      # tests miss. The fixture's tenant is a throwaway with no live
      # /trust/keys endpoint, so its published keys are passed from disk.
      - name: Smoke-test packed tarball
        run: |
          tarball=$(npm pack 2>/dev/null | tail -1)
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" >/dev/null
          ./node_modules/.bin/hasp-verify --version
          ./node_modules/.bin/hasp-verify "$GITHUB_WORKSPACE/test/fixtures/valid.json" --keys-file "$GITHUB_WORKSPACE/test/fixtures/published-keys.json" --skip-tsa
          rm "$GITHUB_WORKSPACE/$tarball"

      # Rehearsal only (workflow_dispatch with dry_run=true): show exactly what
      # would be published, without publishing. The build + smoke test above
      # have already run, so this exercises the whole path bar the final upload.
      - name: Publish preview (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run

      # Publish-only: no `version:` script, so changesets/action never opens a
      # Version PR — it publishes when package.json is ahead of npm (the guard
      # above guarantees no changesets remain). createGithubReleases still tags +
      # cuts the GitHub Release.
      - name: Publish to npm
        id: changesets
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth is via npm Trusted Publisher (OIDC) — no long-lived token.
          # Configured at https://www.npmjs.com/package/@usehasp/verify/access
          # for repo UseHasp/verify, workflow release.yml. `id-token: write`
          # above is what makes OIDC available to this step.
          NPM_CONFIG_PROVENANCE: "true"

      # changeset publish removes the .tgz after upload. Repack so the
      # attest step has a subject. Provenance is already published via
      # `NPM_CONFIG_PROVENANCE: true` above — this is a second-layer
      # attestation linked to the workflow run.
      - name: Repack for attestation
        if: steps.changesets.outputs.published == 'true'
        run: npm pack

      - name: Attest published tarball
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "*.tgz"
