name: test

# PR-only. Pushes to main are already fully tested upstream: the monorepo's
# ci-verify.yml runs this same matrix on every PR, and release.yml re-runs
# lint/typecheck/test before it publishes — so a `push: main` run here would be
# pure duplication of work already done (double CI minutes per release). This
# still gates PRs raised inside the public repo (e.g. Dependabot bumps).
on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: openssl version
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 30
